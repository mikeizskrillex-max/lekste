name: Refresh store prices

# Every Monday 05:17 UTC (07:17 Vilnius in winter), after weekly promotions start,
# and on demand from the Actions tab. Commits data/prices.json only when it changed;
# the hosting (e.g. Vercel) redeploys on that commit.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read prices and promotions from product pages
        run: node scripts/refresh-prices.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/prices.json; then echo "No price changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Weekly price refresh $(date -u +%Y-%m-%d)"
          git push
