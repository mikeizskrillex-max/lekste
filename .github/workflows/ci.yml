name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, unit tests, i18n, build, e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:check
      - run: npm run ingredients:check
      - run: npm run availability:check
      - run: npm run recipes:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --trace off

  database:
    name: Migrations + RLS tests (Postgres 16 + pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Postgres 16 and pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap
      - run: npm run db:local

  migrate:
    name: Apply migrations to Supabase
    # Runs only after both checks pass on main, and only when the SUPABASE_DB_URL secret exists.
    needs: [app, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Migrate
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL secret is not set — skipping migrations"
            exit 0
          fi
          npm run db:migrate
          npm run ingredients:import
          npm run recipes:import
