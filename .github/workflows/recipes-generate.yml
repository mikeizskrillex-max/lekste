name: Generate recipes

# Started by hand: Actions → Generate recipes → Run workflow. Needs the repository secret ANTHROPIC_API_KEY.
# New recipes pass the automatic check first; only those are committed to data/recipes/.
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many recipes'
        default: '20'
      meal:
        description: 'breakfast | lunch | dinner | snack'
        default: 'dinner'
      diet:
        description: 'empty | vegetarian | vegan | pescatarian | no_pork'
        default: ''
      max_minutes:
        description: 'Max total time, minutes (empty = any)'
        default: ''
      max_usd:
        description: 'Spending limit for this run, USD'
        default: '5'

concurrency:
  group: recipes-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate and check
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the repository secret ANTHROPIC_API_KEY first"
            exit 1
          fi
          # the model comes from the repository variable, otherwise from .env.example
          export AI_RECIPE_MODEL="${{ vars.AI_RECIPE_MODEL }}"
          [ -n "$AI_RECIPE_MODEL" ] || export AI_RECIPE_MODEL="$(grep '^AI_RECIPE_MODEL=' .env.example | cut -d= -f2 | awk '{print $1}')"
          ARGS="--count ${{ inputs.count }} --meal ${{ inputs.meal }} --max-usd ${{ inputs.max_usd }}"
          [ -n "${{ inputs.diet }}" ] && ARGS="$ARGS --diet ${{ inputs.diet }}"
          [ -n "${{ inputs.max_minutes }}" ] && ARGS="$ARGS --max-minutes ${{ inputs.max_minutes }}"
          npm run recipes:generate -- $ARGS | tee generate.log
          npm run recipes:check | tee -a generate.log
          npm run availability:check
          { echo '```'; tail -60 generate.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit new recipes
        run: |
          if [ -n "$(git status --porcelain data/recipes)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/recipes
            git commit -m "chore(recipes): ${{ inputs.count }} ${{ inputs.meal }} ${{ inputs.diet }} recipes"
            git push
          fi
